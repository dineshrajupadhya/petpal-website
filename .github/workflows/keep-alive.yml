name: Keep Backend Alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render backend
        run: |
          curl -sS --max-time 60 --retry 3 --retry-delay 10 \
            https://petpal-api-ejwx.onrender.com/api/health || true
