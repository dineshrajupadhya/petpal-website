name: Rearm Test

on:
  workflow_dispatch:

jobs:
  test-dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch keep-alive with GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run keep-alive.yml --repo "$GITHUB_REPOSITORY" -f mode=once
